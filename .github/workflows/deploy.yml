
name: Deploy Backend Imperio Global

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: imperio-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo desde GitHub
        uses: actions/checkout@v4

      - name: 2. Configurar SSH seguro
        env:
          SSH_KEY_B64: ${{ secrets.V2_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY_B64" ]; then
            echo "ERROR: Falta el secreto SSH del backend"
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/imperio_back_deploy
          chmod 600 ~/.ssh/imperio_back_deploy

          ssh-keygen -y -f ~/.ssh/imperio_back_deploy > /dev/null
          echo "Clave SSH valida"

          ssh-keyscan -T 10 -t ecdsa 205.234.243.127 \
            > ~/.ssh/known_hosts 2>/dev/null

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 \
            | awk '{print $2}' \
            | grep -Fxq 'SHA256:zrXAwTBx3+1smpR+vc0Tjj78+jYk2gGitm4H/vxjos0'

          chmod 600 ~/.ssh/known_hosts
          echo "Identidad del VPS verificada"

      - name: 3. Verificar conexion al VPS
        run: |
          ssh \
            -i ~/.ssh/imperio_back_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            ubuntu@205.234.243.127 \
            "echo 'Conexion SSH backend correcta'"

      - name: 4. Desplegar Laravel en V2Networks
        run: |
          ssh \
            -i ~/.ssh/imperio_back_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            ubuntu@205.234.243.127 'bash -se' <<'REMOTE'
          set -e

          cd /home/ubuntu/apps/imperio-global-back

          # Verificar configuracion
          if [ ! -f .env ]; then
            echo "ERROR: Falta archivo .env"
            exit 1
          fi

          # Actualizar codigo desde GitHub
          git fetch origin main
          git reset --hard origin/main

          # Instalar dependencias
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist

          # Limpiar cache de Laravel
          php artisan optimize:clear

          # Verificar esquema existente
          # No ejecuta migraciones
          php artisan mlm:deployment-check \
            --production \
            --database=imperio_bd

          # Mantener permisos de Laravel
          sudo chown -R ubuntu:www-data storage bootstrap/cache
          sudo chmod -R ug+rwX storage bootstrap/cache

          sudo chown ubuntu:www-data .env
          sudo chmod 640 .env

          # Optimizar la aplicacion
          php artisan optimize

          # Notificar reinicio de workers
          php artisan queue:restart

          echo "BACKEND DESPLEGADO CORRECTAMENTE"
          REMOTE

      - name: 5. Verificar Laravel en el VPS
        run: |
          ssh \
            -i ~/.ssh/imperio_back_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            ubuntu@205.234.243.127 \
            "cd /home/ubuntu/apps/imperio-global-back && php artisan --version"

      - name: 6. Verificar HTTPS del backend
        run: |
          curl --fail --silent --show-error \
            --output /dev/null \
            https://vps.imperioglobal.org/

          echo "BACKEND HTTPS RESPONDE CORRECTAMENTE"

      - name: 7. Limpiar clave temporal
        if: always()
        run: |
          rm -f ~/.ssh/imperio_back_deploy
