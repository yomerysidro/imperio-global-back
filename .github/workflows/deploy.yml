
name: Deploy Backend Imperio Global

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: imperio-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Codigo del Repositorio
        uses: actions/checkout@v4

      - name: Despliegue SSH en V2Networks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '205.234.243.127'
          username: 'ubuntu'
          password: ${{ secrets.V2_SSH_PASSWORD }}
          port: 22
          fingerprint: 'SHA256:NuevMHOTwobPmjHLMGNvJq/VM5J8G3TdXbGgVHjAAbg'
          command_timeout: 15m
          script: |
            set -e

            # 1. Ingresar al proyecto clonado
            cd /home/ubuntu/apps/imperio-global-back

            # 2. Verificar el archivo de entorno
            if [ ! -f .env ]; then
              echo "ERROR: Falta configurar .env"
              exit 1
            fi

            # 3. Actualizar codigo desde main
            git fetch origin main
            git reset --hard origin/main

            # 4. Instalar dependencias Laravel
            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --prefer-dist

            # 5. Verificar el esquema existente
            php artisan optimize:clear
            php artisan mlm:deployment-check \
              --production \
              --database=imperio_bd

            # 6. Permisos sin quitar propiedad a ubuntu
            sudo chown -R ubuntu:www-data \
              storage bootstrap/cache

            sudo chmod -R ug+rwX \
              storage bootstrap/cache

            sudo chown ubuntu:www-data .env
            sudo chmod 640 .env

            # 7. Reconstruir caches
            php artisan optimize

            # 8. Reiniciar workers de Laravel
            php artisan queue:restart

            echo "Despliegue completado en V2Networks"
